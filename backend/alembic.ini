# Alembic configuration for Experiment Exchange
[alembic]
script_location = alembic
prepend_sys_path = .

# The database URL is read from the app config so we keep one source of truth.
# Set sqlalchemy.url here ONLY if you need to override the app setting.
# sqlalchemy.url = postgresql+psycopg://...

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
